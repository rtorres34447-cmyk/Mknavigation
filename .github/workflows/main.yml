          unzip -q "$RUNNER_TEMP/mkamuy-nav.zip" -d "$RUNNER_TEMP/mkamuy-nav"
          test -f "$RUNNER_TEMP/mkamuy-nav/settings.gradle"
          echo "PROJECT_DIR=$RUNNER_TEMP/mkamuy-nav" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 components from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER" || { echo '::error::SDK manager missing'; exit 1; }
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Upload APK or build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MKamuy-NAV-build-output
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/build/reports/
          if-no-files-found: warn
